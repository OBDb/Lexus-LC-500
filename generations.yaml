    description: "The Lexus LC is a grand tourer manufactured by Lexus, a luxury division of Toyota. Based on the 2012 Lexus LF-LC Concept, it was revealed at the 2016 North American International Auto Show in Detroit. Series production commenced in March 2017, with the first example completed on April 23, 2017. The LC is the first Lexus model to utilize the GA-L platform, which is shared with the full-size XF50 series LS sedan. According to Lexus, the name 'LC' stands for 'Luxury Coupe'. The LC 500 is powered by a 5.0-liter 2UR-GSE V8 engine producing 471 horsepower and 398 lb-ft of torque, paired with a 10-speed Direct Shift automatic transmission and driving the rear wheels. A hybrid-electric variant, the LC 500h, was revealed in February 2016 at the Geneva Motor Show, powered by a 3.5-liter 8GR-FXS V6 engine with a hybrid transmission and lithium-ion battery pack providing a combined 354 horsepower and 500 Nm of torque. The exterior design features a variant of Lexus's spindle grille, tightly compressed mesh at the top transitioning to a wider diamond at the bottom, triple-LED headlights, and a floating roof design creating a distinctive silhouette. The chassis features mixed-material construction combining high-strength steel, aluminum, and carbon fiber, with a double-joint multi-link suspension front and rear designed to reduce necessary height while ensuring mirrored movement. The LC 500 Convertible, based on a concept vehicle, was unveiled at the LA Auto Show on November 20, 2019, with a model year of 2021, featuring a four-layer soft top that can be operated at speeds up to 50 km/h and can be stowed in approximately 15 seconds. The LC is built at Toyota's Motomachi facility, the same plant that produced the Lexus LFA, with the factory reconfigured for LC production and many of the master craftsmen who built the LFA continuing their work on the LC."
